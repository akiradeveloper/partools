[workspace]
members = [
    "massively",
    "oracle",
]
resolver = "3"

[workspace.package]
authors = ["Akira Hayakawa <ruby.wktk@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/akiradeveloper/massively"

[workspace.dependencies]
cubecl = { version = "0.11.0-pre.3", default-features = false, features = [
    "std",
    "stdlib",
] }

# CubeCL kernels use a fixed read/write ABI to avoid a read/storage arity
# product. Debug metadata still increases the memory used by generated code
# without affecting runtime diagnostics.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
